name: CI

on: [pull_request, push]

jobs:
  test:
    runs-on: "ubuntu-latest"
    name: Run tests.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
      - name: Run servers
        run: |
          docker compose up -d
          bash chmod_unix.bash
      - name: Run tests
        run: |
          cargo test

  coverage:
    runs-on: "ubuntu-latest"
    name: Run tests coverage.
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run servers
        run: |
          docker compose up -d
          bash chmod_unix.bash
      - name: Run tests coverage
        run: |
          cargo llvm-cov --doctests

  quality:
    name: Quality code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Analyze code
        uses: iepathos/debtmap-action@v1
      - name: View Report
        run: |
          cat debtmap-report.md

  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --check
      - name: Check clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  examples:
    name: Run examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Run servers
        run: |
          docker compose up -d
          bash chmod_unix.bash
      - name: Run examples
        run: cargo run --example simple

  security-scan:
    name: Run security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run Opengrep scan
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          sh -c "/home/runner/.opengrep/cli/latest/opengrep scan \
          --config auto \
          --error \
          --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint"

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: cargo mutants -vV --in-place
